<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặng Anh Tú lớp 12A5</title>
  <style>
    body {
      margin: 0;
      padding: 48px 20px;
      background: #fff;
      color: #222;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    main {
      width: min(640px, 100%);
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 36px;
      font-size: clamp(28px, 6vw, 40px);
      font-weight: normal;
    }
    h2 {
      margin: 0 0 28px;
      font-size: clamp(23px, 5vw, 30px);
      font-weight: normal;
    }
    .poem {
      font-size: 19px;
      line-height: 2;
    }
    .poem p { margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Đặng Anh Tú lớp 12A5</h1>
    <h2>Chút Nắng Trời Đông</h2>
    <section class="poem">
      <p>Gió bắc tràn về góc phố quen</p>
      <p>Khẽ lay chiếc lá rụng bên thềm</p>
      <p>Sương giăng buốt lạnh bàn tay nhỏ</p>
      <p>Nắng nhạt nghiêng soi bóng lặng im</p>
      <p>Chút gió heo may gieo nỗi nhớ</p>
      <p>Âm thầm sưởi ấm một trời thơ</p>
    </section>
  </main>
</body>
</html>
